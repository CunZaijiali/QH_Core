[package]
name = "qh_core"
version = "0.1.0"
edition = "2024"

[dependencies]
qh_macros = { path = "../qh_macros" }
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
ractor = { version = "0.16.5", features = ["async-trait"] }
futures-util = "0.3"
jsonrpc-core = "18.0.0"
toml = "1.1.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
url = "2.5"
sha2 = "0.11.0"
anyhow = "1.0.104"
serde_with = "3.23.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
time = "0.3.55"
sqlx = {version="0.9.0", features=["runtime-tokio", "sqlite"]}
libsqlite3-sys="0.37.0"
hex = "0.4.3"
directories = "6.0.0"
secrecy = "0.10.3"
keyring-core = "1.0.0"
dashmap = "6.2.1"
papaya = "0.2.5"
zeroize = "1.9.0"
uuid = { version = "1.27.0" , features = ["v4", "v7", "js"]}
rayon = "1.12.0"
base64 = "0.23.1"
hashbrown = { version = "0.17.1" , features = ["rayon", "serde"]}

[target.'cfg(target_os="macos")'.dependencies]
apple-native-keyring-store = "1.0.2"

[target.'cfg(target_os="windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os="linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"
